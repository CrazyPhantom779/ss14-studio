name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build core, UI and VS Code extension
        run: npm run build

  package-vscode:
    name: Package VS Code extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ss14-studio-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

  sidecar-smoke:
    name: Rider sidecar smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Rider web and sidecar assets
        run: npm run build:rider

      - name: Run smoke test against the committed fixture
        run: node apps/rider/scripts/smoke.mjs

  rider-plugin:
    name: Build Rider plugin
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Rider web and sidecar assets
        run: npm run build:rider

      - name: Build plugin ZIP
        working-directory: apps/rider
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin --no-daemon

      - name: Upload Rider plugin
        uses: actions/upload-artifact@v7
        with:
          name: ss14-studio-rider-plugin
          path: apps/rider/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-vscode, sidecar-smoke, rider-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.vsix
            release-artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-vscode:
    name: Publish VS Code / Open VSX
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-vscode]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: ss14-studio-vsix
          path: release-artifacts

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@latest publish --packagePath release-artifacts/*.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OPEN_VSX_TOKEN != ''
        run: npx --yes ovsx@latest publish --packagePath release-artifacts/*.vsix --pat "$OPEN_VSX_TOKEN"

  publish-rider:
    name: Publish JetBrains Marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rider-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Rider web and sidecar assets
        run: npm run build:rider

      - name: Sign and publish plugin
        if: env.PUBLISH_TOKEN != ''
        working-directory: apps/rider
        run: |
          chmod +x gradlew
          ./gradlew publishPlugin --no-daemon

