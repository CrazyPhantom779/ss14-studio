name: Feature request
description: Suggest a workflow, integration, visual or engine-coverage improvement.
title: '[Feature]: '
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        SS14 Studio keeps native editors as the default and adds opt-in Studio
        views. Please describe the workflow you are trying to complete, not only
        the UI you imagine. Read the [AI disclosure](https://github.com/CrazyPhantom779/ss14-studio/blob/main/AI-GENERATED.md)
        and the [known limitations](https://github.com/CrazyPhantom779/ss14-studio#known-limitations) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what gets in the way today?
      placeholder: I want to compare a prototype's resolved fields against its parent while editing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Screenshots or mockups are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, settings, scripts or workarounds you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Construction graphs
        - YAML prototypes and partials
        - RobustToolbox XAML
        - RSI sprites and pixel editor
        - Diff and merge
        - Dashboard, search or navigation
        - VS Code integration
        - Rider integration
        - Settings and accessibility
        - Documentation, tests or packaging
        - Other
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      multiple: true
      options:
        - VS Code
        - JetBrains Rider
        - Both
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: SS14 fork, repository size, relevant engine behavior or example files.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I understand that generated XAML uses an AutoGenerated marker, not an AI watermark.
          required: true
        - label: I am willing to help test the change or provide sample files.
          required: false
